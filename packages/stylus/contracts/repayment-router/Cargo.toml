[package]
name = "repayment-router"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Fouding validated repayment router for Arbitrum Stylus"

[dependencies]
alloy-sol-types = { version = "=1.6.1", default-features = false }
stylus-sdk = "=0.10.8"

[dev-dependencies]
stylus-sdk = { version = "=0.10.8", features = ["stylus-test"] }

[features]
default = ["mini-alloc"]
export-abi = ["stylus-sdk/export-abi"]
debug = ["stylus-sdk/debug"]
mini-alloc = ["stylus-sdk/mini-alloc"]

[[bin]]
name = "repayment-router"
path = "src/main.rs"

[lib]
crate-type = ["lib", "cdylib"]

[contract]
name = "repayment-router"
